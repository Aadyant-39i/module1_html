<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Arguments</title>
    </head> 
<body>
    <h6>JavaScript Arguments</H6>

<p>Finding the smallest number with help of Argument Objects</p>

<p id="result"></p>

<script> 
function findMin() {
    var i;
    var min = arguments[0];

    for(i = 0; i < arguments.length; i++) {
        if(arguments[i] < min) {
            min = arguments[i];
        }
    }

    return min;
}

document.getElementById("result").innerHTML = findMin(4,7,10, 2, 1, -1, -22, 44, 5, 6);
</script>

</body>
</html>
