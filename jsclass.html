<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Classes</title>
    </head>
    <body>
        <h1>JavaScript Classes</h1>
        <p>This is a simple example of a JavaScript class.</p>
        <p id="student1"></p>
        <p id="student2"></p>
        <script>
            class Student {
                constructor(name, year) {
                    this.name = name;
                    this.year = year;
                }
                age() {
                    let date = new Date();
                    return date.getFullYear() - this.year;
                    
                }
            }   

            const student1 = new Student("Aadyant ", 2014);
            document.getElementById("student1").innerHTML = 
            "My name is " + student1.name + " I was born in " + student1.year + " and I am " + student1.age() + " years old.";

            const student2 = new Student("Hanvish", 2017);
            document.getElementById("student2").innerHTML = 
            "My name is " + student2.name + " I was born in " + student2.year + " and I am " + student2.age() + " years old.";

            


        </script>
    </body>
</html>
