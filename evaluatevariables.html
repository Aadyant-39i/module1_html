<!DOCTYPE html>
<html>
    <body>
        <h1>Evaluate Variables</h1>
        <p>Click the button to evaluate the variables.</p>
        <button onclick="myFunction()">Evaluate Variables</button>
        <p id = "result"></p>

        <script>
            function myFunction() {
                var x = 10;
                var y = 20;


                var a = eval("x + y") + "<br>";
                var b = eval("2*2") + "<br>";
                var c = eval("y - x") + "<br>";

                var res = a + b + c;
                document.getElementById("result").innerHTML = res;
            
            }
        </script>
    </body>
</html>
