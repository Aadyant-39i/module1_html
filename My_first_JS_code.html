<!DOCTYPE html>
<html>

<body>

<h1>JavaScript Variables</h1>

<p>Sum of two Numbers</p>

<p id="result1"></p>
<p id="result2"></p>
<p id="result3"></p>
<p id="result4"></p>
<p id="merge1"></p>
<p id="modulus"></p>

<script>
    var num1 = 89;
    var num2 = 77;
    var sum = num1 + num2;

    document.getElementById("result1").innerHTML =
    "The total sum is: " + sum;
     var num1 = 89;
    var num2 = 77;
    var difference = num1 - num2;
//Concatenation//
    document.getElementById("result2").innerHTML =
    "The difference between the two numbers is: " + difference;
     var num1 = 89;
    var num2 = 77;
    var product = num1 * num2;

    document.getElementById("result3").innerHTML =
    "The product is: " + product;
     var num1 = 89;
    var num2 = 77;
    var quotient = num1 / num2;

    document.getElementById("result4").innerHTML =
    "The Quotient is: " + quotient;
    var name1 = "Aadyant ";
    var name2 = "Nyayapati";
    var merge = name1 + name2;
    document.getElementById("merge1").innerHTML =
    "The merged name is: " + merge;

     var num1 = 19997;
    var num2 = 9999;
    var modulus = num1 % num2;

    document.getElementById("modulus").innerHTML =
    "The remainder is: " + modulus;
</script>


</body>

</html>
