<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Call Stack</title>
    </head>
    <body>
        <h1>JavaScript Call Stack</h1>
        <p id="demo"></p>
        <script>
            function add(a, b, c) {
                return a + b + c;
            }
            function average(a, b, c) {
                return add(a, b, c) / 3;
            }
            let result = average(90, 58, 56);
            document.getElementById("demo").innerHTML = "The average is: " + result;
        </script>
    </body>
</html>
