<!DOCTYPE html>
<html>
<head>
    <title>String Addition</title>
</head>
<body>
    <script>
        var x = 70;
        var y = 90;
        
        document.write("The result of adding " + x + " and " + y + " as strings is: " + String(x) + String(y));
        document.write("<br>") 
        document.write("The result of adding " + x + " and " + y + " as numbers is: ", x + y); 
        
    </script>
</body>
</html>
