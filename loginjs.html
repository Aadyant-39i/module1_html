<body>
    <h1>REAL TIME VALIDATION USING JAVASCRIPT</h1>
    <hr>
    <div class="box">
        <form id="loginForm">
            <div class="row">
                <label>Email:</label>
                <input type="text" id="email" placeholder="abcdefghi@gmail.com">
            </div>
            <br>
            <div class="row">
                <label>Password:</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <br>
            <div class="row">
                <label>Age:</label>
                <input type="number" id="age" placeholder="Enter your age">
            </div>
            <br>
            <center><button type="submit">Login</button></center>
        </form>
    </div>
</body>
