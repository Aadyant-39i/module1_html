<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Arguments</title>
    </head> 
<body>
    <h6>JavaScript Arguments</H6>

<p>Finding the largest number with help of Argument Objects</p>

<p id="result"></p>

<script> 
function findMax() {
    var i;
    var max = 0;

    for(i = 0; i < arguments.length; i++) {
        if(arguments[i] > max) {
            max = arguments[i];
        }
    }

    return max;
}

document.getElementById("result").innerHTML = findMax(4,7,10, 2, 44, 5, 6);
</script>

</body>
</html>
